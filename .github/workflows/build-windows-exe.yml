name: Build Windows EXE

permissions:
  contents: write

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-windows.txt pyinstaller

      - name: Build EXE
        working-directory: app
        run: |
          pyinstaller --noconfirm --clean --onefile --name "AStockDataApp" `
            --add-data "frontend;frontend" `
            --add-data "gap_model.json;." `
            --collect-all easy_tdx `
            --collect-all sklearn `
            --collect-all scipy `
            exe_launcher.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: astock-data-app-exe
          path: app/dist/*.exe

      - name: Attach EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-windows
          files: app/dist/*.exe
